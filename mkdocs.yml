  - Setup do Front-End React:
      - 01. Criando a página /status: 05_setup_frontend/01_Criando_pagina_status.md
  - Usuários e Autenticaçãpadd:
      - 01. Criando a Migration de Users: 06_Usuarios/01_Criando_migration_Users.md
      - 02. Criando a Rota, Controller e Model de Users: 06_Usuarios/02_Criando_Rota_Users.md
theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.expand
    - search.highlight
    - search.suggest
    
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
