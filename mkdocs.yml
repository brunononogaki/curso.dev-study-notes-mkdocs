      - 03. Definindo os Linters: 01_setup_ambiente/03_linters.md
      - 04. Git Overview: 01_setup_ambiente/04_Git_Overview.md
      - 05. Trabalhando com as dependências do projeto: 01_setup_ambiente/05_Dependencias_do_projeto.md
  - Setup do Backend:
      - 01. Criando uma página de status: 02_setup_backend/01_pagina_status.md
      - 02. Integrando um Banco de Dados local: 02_setup_backend/02_banco_local.md
      - 03. Integrando um Banco de Dados de Produção e Staging: 02_setup_backend/03_banco_prod_staging.md
      - 04. Padronizando Erros: 02_setup_backend/04_padronizando_erros.md
      - 05. Padronizando os Controllers: 02_setup_backend/05_padronizando_controllers.md
  - Database Migrations:
      - 01. Configurando o node-pg-migrations: 03_database_migrations/01_Configurando_node-pg-migrations.md
      - 02. Criando os endpoints da API para migrations: 03_database_migrations/02_Criando_API_Migration.md
  - Setup do CI/CD:
